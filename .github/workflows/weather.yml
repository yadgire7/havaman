# Every 4 hours (or by hand from the Actions tab): fetch the forecast for every
# taluka from Open-Meteo, check it, build the site and publish it to
# havaman.shetkarishala.com. If fewer than 90% of talukas get a forecast, the
# run fails before publishing, so the last good site stays up.
#
# Security: no secrets are used at all; no pull_request trigger; the build job
# has a read-only token, only the deploy job may publish Pages; every action is
# pinned to a full commit SHA. If a run fails, GitHub's own failure email tells
# the admin.
name: Weather

on:
  schedule:
    # 00:00, 04:00 ... 20:00 UTC = 05:30, 09:30, 13:30, 17:30, 21:30, 01:30 IST.
    # tests/test_repo.py fails if this stops matching config.yaml.
    - cron: "0 0-23/4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Fetch and check the forecast
        run: python fetch_weather.py
      - name: Build the site
        run: python build_site.py
      - name: Upload the pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
