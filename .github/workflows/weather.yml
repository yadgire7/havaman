# Fetches the forecast for every taluka from Open-Meteo and checks it, every
# 4 hours, or by hand from the Actions tab. For now it keeps the checked file
# as a run artifact; the Pages deploy is added with the pages.
#
# Security: no secrets are used at all; no pull_request trigger; read-only
# token; every action pinned to a full commit SHA. If a run fails, GitHub's
# own failure email tells the admin.
name: Weather

on:
  schedule:
    # 00:00, 04:00 ... 20:00 UTC = 05:30, 09:30, 13:30, 17:30, 21:30, 01:30 IST.
    # tests/test_repo.py fails if this stops matching config.yaml.
    - cron: "0 0-23/4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Fetch and check the forecast
        run: python fetch_weather.py
      - name: Keep the checked file for 3 days
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: weather
          path: out/weather/weather.json.gz
          retention-days: 3
