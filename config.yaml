# Settings for the Shetkari Shala weather pages (havaman.shetkarishala.com).
# Everything that might change lives here; the code holds no place names.

site:
  base_url: "https://havaman.shetkarishala.com/"
  prices_url: "https://bajarbhav.shetkarishala.com/"   # each district page links to its prices

weather:
  talukas_file: talukas.yaml   # 358 talukas + Mumbai City, from OpenStreetMap (ODbL)
  forecast_days: 7             # hourly and daily, counting today
  batch_size: 50               # talukas per request
  pause_seconds: 15            # between requests: stays under 600 calls a minute
  every_hours: 4               # how often the forecast refreshes
  first_run_ist: "01:30"       # then every 4 h: 05:30, 09:30, 13:30, 17:30, 21:30,
                               # each 30 min before a price run (06, 12, 18, 00)

# Alerts for the next hours, by fixed rules. Heavy rain follows IMD's
# "heavy rainfall" mark (64.5 mm in a day).
alerts:
  window_hours: 24
  rain_chance: 60        # % chance of rain in any hour
  heavy_rain_mm: 64.5    # mm in a day, today or tomorrow
  heat_c: 40             # °C
  wind_gust_kmh: 40      # km/h gusts: not a day for spraying

# How times are named, as on the price pages: 12 am to 12 pm सकाळ,
# 12 pm to 6 pm दुपार, 6 pm to 12 am संध्याकाळ.
day_parts_mr:
  - {from: 0, mr: "सकाळ"}
  - {from: 12, mr: "दुपार"}
  - {from: 18, mr: "संध्याकाळ"}

# Every Marathi word on the pages. DRAFT: the admin reviews these.
text_mr:
  site_title: "महाराष्ट्र हवामान"
